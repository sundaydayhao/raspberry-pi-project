<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奶茶店展示屏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            overflow: hidden;
            background: #000;
        }

        .slideshow-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            padding: 60px;
            text-align: center;
        }

        .slide.active {
            opacity: 1;
            z-index: 1;
        }

        .slide-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .slide-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.3;
        }

        .slide-content {
            position: relative;
            z-index: 2;
            color: white;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            max-width: 1200px;
        }

        .slide-title {
            font-size: 120px;
            font-weight: bold;
            margin-bottom: 30px;
            animation: fadeInDown 1s ease-out;
        }

        .slide-subtitle {
            font-size: 60px;
            margin-bottom: 40px;
            opacity: 0.95;
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        .slide-text {
            font-size: 48px;
            line-height: 1.8;
            white-space: pre-line;
            opacity: 0.9;
            animation: fadeIn 1s ease-out 0.4s both;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 36px;
            text-align: center;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 32px;
            text-align: center;
            background: rgba(255, 0, 0, 0.8);
            padding: 40px 60px;
            border-radius: 10px;
        }

        /* 隐藏鼠标光标 */
        body {
            cursor: none;
        }

        /* 信息栏样式 */
        .info-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            z-index: 100;
            color: white;
            font-size: 24px;
        }

        .info-left {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .info-right {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .time-display {
            font-size: 32px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .date-display {
            font-size: 20px;
            opacity: 0.9;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }

        .weather-display {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 24px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }

        .weather-icon {
            font-size: 36px;
        }

        .weather-temp {
            font-size: 28px;
            font-weight: bold;
        }

        .weather-desc {
            font-size: 20px;
            opacity: 0.9;
        }

        .divider {
            width: 2px;
            height: 40px;
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div id="loading" class="loading">
        <div class="loading-spinner"></div>
        <div>加载中...</div>
    </div>

    <div id="slideshow" class="slideshow-container" style="display: none;"></div>

    <!-- 信息栏 -->
    <div id="info-bar" class="info-bar" style="display: none;">
        <div class="info-left">
            <div class="time-display" id="time-display">00:00</div>
            <div class="divider"></div>
            <div class="date-display" id="date-display">2026年1月1日 星期一</div>
        </div>
        <div class="info-right">
            <div class="weather-display" id="weather-display">
                <span class="weather-icon">☀️</span>
                <span class="weather-temp">--°C</span>
                <span class="weather-desc">加载中...</span>
            </div>
        </div>
    </div>

    <script>
        let slides = [];
        let currentSlide = 0;
        let slideInterval = null;
        let settings = {};

        // 加载内容
        async function loadContent() {
            try {
                const response = await fetch('/api/content');
                const data = await response.json();
                
                slides = data.slides || [];
                settings = data.settings || { defaultDuration: 5, autoPlay: true };
                
                if (slides.length === 0) {
                    showError('没有可显示的内容');
                    return;
                }
                
                renderSlides();
                startSlideshow();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('slideshow').style.display = 'block';
            } catch (error) {
                console.error('加载内容失败:', error);
                showError('加载内容失败，请检查网络连接');
            }
        }

        // 渲染幻灯片
        function renderSlides() {
            const container = document.getElementById('slideshow');
            container.innerHTML = '';
            
            slides.forEach((slide, index) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'slide';
                if (index === 0) slideDiv.classList.add('active');
                
                // 背景
                const background = document.createElement('div');
                background.className = 'slide-background';
                background.style.background = slide.backgroundColor || '#FF6B9D';
                slideDiv.appendChild(background);
                
                // 背景图片
                if (slide.image) {
                    const img = document.createElement('img');
                    img.className = 'slide-image';
                    img.src = slide.image;
                    img.onerror = () => {
                        console.warn('图片加载失败:', slide.image);
                    };
                    slideDiv.appendChild(img);
                }
                
                // 内容
                const content = document.createElement('div');
                content.className = 'slide-content';
                
                if (slide.title) {
                    const title = document.createElement('div');
                    title.className = 'slide-title';
                    title.textContent = slide.title;
                    content.appendChild(title);
                }
                
                if (slide.subtitle) {
                    const subtitle = document.createElement('div');
                    subtitle.className = 'slide-subtitle';
                    subtitle.textContent = slide.subtitle;
                    content.appendChild(subtitle);
                }
                
                if (slide.content) {
                    const text = document.createElement('div');
                    text.className = 'slide-text';
                    text.textContent = slide.content;
                    content.appendChild(text);
                }
                
                slideDiv.appendChild(content);
                container.appendChild(slideDiv);
            });
        }

        // 切换幻灯片
        function showSlide(index) {
            const slideElements = document.querySelectorAll('.slide');
            slideElements.forEach(slide => slide.classList.remove('active'));
            
            if (slideElements[index]) {
                slideElements[index].classList.add('active');
            }
        }

        // 下一张幻灯片
        function nextSlide() {
            currentSlide = (currentSlide + 1) % slides.length;
            showSlide(currentSlide);
        }

        // 开始幻灯片播放
        function startSlideshow() {
            if (!settings.autoPlay) return;
            
            if (slideInterval) {
                clearInterval(slideInterval);
            }
            
            const duration = (slides[currentSlide]?.duration || settings.defaultDuration) * 1000;
            
            slideInterval = setInterval(() => {
                nextSlide();
                // 重新设置定时器以适应不同的持续时间
                startSlideshow();
            }, duration);
        }

        // 显示错误信息
        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            document.body.appendChild(errorDiv);
        }

        // 定期刷新内容（每5分钟）
        function scheduleRefresh() {
            setInterval(() => {
                console.log('刷新内容...');
                loadContent();
            }, 5 * 60 * 1000);
        }

        // 更新时间显示
        function updateTime() {
            const now = new Date();
            
            // 更新时间
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('time-display').textContent = `${hours}:${minutes}`;
            
            // 更新日期
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const weekday = weekdays[now.getDay()];
            document.getElementById('date-display').textContent = `${year}年${month}月${date}日 ${weekday}`;
        }

        // 获取天气图标
        function getWeatherIcon(weather) {
            const iconMap = {
                '晴': '☀️',
                '多云': '⛅',
                '阴': '☁️',
                '雨': '🌧️',
                '雪': '❄️',
                '雷': '⛈️',
                '雾': '🌫️',
                '霾': '😷'
            };
            
            for (const key in iconMap) {
                if (weather.includes(key)) {
                    return iconMap[key];
                }
            }
            return '🌤️';
        }

        // 获取天气信息（使用免费天气API）
        async function updateWeather() {
            try {
                // 使用高德天气API（需要申请免费key）
                // 这里使用模拟数据，实际使用时需要替换为真实API
                // const response = await fetch('https://restapi.amap.com/v3/weather/weatherInfo?city=城市代码&key=你的key');
                
                // 模拟天气数据
                const weatherData = {
                    temperature: Math.floor(Math.random() * 15) + 15, // 15-30度
                    weather: ['晴', '多云', '阴', '小雨'][Math.floor(Math.random() * 4)],
                    city: '本地'
                };
                
                // 更新天气显示
                const weatherDisplay = document.getElementById('weather-display');
                const icon = getWeatherIcon(weatherData.weather);
                
                weatherDisplay.innerHTML = `
                    <span class="weather-icon">${icon}</span>
                    <span class="weather-temp">${weatherData.temperature}°C</span>
                    <span class="weather-desc">${weatherData.weather}</span>
                `;
            } catch (error) {
                console.error('获取天气失败:', error);
                // 显示默认天气
                document.getElementById('weather-display').innerHTML = `
                    <span class="weather-icon">🌤️</span>
                    <span class="weather-temp">--°C</span>
                    <span class="weather-desc">天气</span>
                `;
            }
        }

        // 初始化信息栏
        function initInfoBar() {
            // 显示信息栏
            document.getElementById('info-bar').style.display = 'flex';
            
            // 立即更新一次
            updateTime();
            updateWeather();
            
            // 每秒更新时间
            setInterval(updateTime, 1000);
            
            // 每30分钟更新天气
            setInterval(updateWeather, 30 * 60 * 1000);
        }

        // 页面加载完成后初始化
        window.addEventListener('load', () => {
            loadContent();
            scheduleRefresh();
            initInfoBar();
        });

        // 键盘控制（用于调试）
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                nextSlide();
                startSlideshow();
            } else if (e.key === 'ArrowLeft') {
                currentSlide = (currentSlide - 1 + slides.length) % slides.length;
                showSlide(currentSlide);
                startSlideshow();
            } else if (e.key === 'r' || e.key === 'R') {
                location.reload();
            }
        });
    </script>
</body>
</html>
